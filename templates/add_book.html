<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Book</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📚 Add New Book</h1>
        <p>Add a new book to the library collection</p>
    </div>

    <br>

    <div class="card">

        <h2>➕ Book Details</h2>

        <form method="POST" action="/add-book">

            <label>Book Title:</label>
            <br>

            <input type="text" name="title" placeholder="Enter book title" class="search-input" required>

            <br><br>

            <label>Author:</label>
            <br>

           <input type="text" name="author" placeholder="Enter author name" class="search-input" required>

            <br><br>

            <button type="submit">➕ Add Book</button>

        </form>

    </div>

    <br>

    <a href="/books">
        <button>📚 Back to Books</button>
    </a>

    <a href="/">
        <button>🏠 Dashboard</button>
    </a>

</div>

</body>
</html>
